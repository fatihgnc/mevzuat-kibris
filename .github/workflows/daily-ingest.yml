name: daily-ingest

on:
  schedule:
    - cron: '0 4 * * *' # 07:00 TRT
    - cron: '0 15 * * *' # 18:00 TRT
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # İş düzeyinde tanımlı: adım düzeyindeki `if` yalnızca burayı görebiliyor,
    # aynı adımda tanımlanan env'i göremiyor.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Metin çıkarma araçları (spec 7.2). tesseract-ocr-tur Türkçe dil paketi.
      #
      # python3-pdfminer BİRİNCİL çıkarıcıdır (scripts/extract-text/pdf_text.py).
      # Gömülü fontun ToUnicode tablosu kullanılamadığında pdftotext metni 29
      # kaydırılmış basıyor ve kaydırılmış karakter sıradan noktalamadan ayırt
      # EDİLEMİYOR; pdfminer aynı karakteri "(cid:N)" diye işaretliyor, cid.ts
      # geri çeviriyor. Python zaten ocrmypdf için kurulu.
      #
      # poppler-utils KALIYOR: pdfminer yoksa yedek yol, ve OCR çıktısı ondan okunuyor.
      - name: PDF ve OCR araçları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-tur ocrmypdf ghostscript \
            python3-pdfminer

      - run: npm ci
      - run: npm run ingest:daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      # Kademeli üretimin ikinci basamağı (spec 3.8). Ingest'ten SONRA ve ayrı
      # adımda: OpenAI kesintisi PDF çekmeyi durdurmasın, ingest hatası da
      # özetlemeyi tetiklemesin.
      #
      # Anahtar yoksa adım atlanıyor, iş yeşil kalıyor. Ürün özetsiz de
      # çalışıyor — maskelenmiş başlık gösteriliyor (3. basamak) — ve günlük
      # ingest'i kurulmamış bir anahtar yüzünden kırmızıya boyamak, asıl işin
      # (yeni sayıların yakalanması) sessizce durmasına yol açar.
      #
      # Yalnızca hiç denenmemiş kayıtları soruyor; reddedilenler
      # `summary_attempted_at` ile damgalı ve tekrar sorulmuyor (migration 0009).
      - name: LLM özet katmanı
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: npm run summarize
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
