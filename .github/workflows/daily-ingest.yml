name: daily-ingest

on:
  schedule:
    # HER 3 SAATTE BIR, gunde iki kez degil.
    #
    # GitHub zamanli workflow'lari dusuk oncelikle kuyruga aliyor ve GECIKTIRIYOR:
    # '0 4' ile '0 15' yazan bu iki cron gercekte 08:27 ve 18:20 UTC'de kosuyordu,
    # yani 3,5-4,5 saat sonra. Yorumlar "07:00 / 18:00 TRT" diyordu ama pratikte
    # 11:30 ve 21:20 TRT oluyordu.
    #
    # Sonucu 4 Eylul'de goruldu: 165 ve 166 numarali sayilar sabahki kosumdan
    # SONRA yayimlandi (kosum issuesSeen:164 gormustu) ve aksam kosumu daha
    # sirasi gelmeden elle tetiklenene kadar sitede gorunmediler.
    #
    # Gecikmeyi ortadan kaldiramayiz -- GitHub'in isi. Yapabilecegimiz sey
    # ARALIGI kisaltmak: en kotu bekleme 3 saat + gecikme oluyor, onceki ~16
    # saat yerine. Depo public, yani Actions dakikasi ucretsiz; yeni sayi yoksa
    # kosum kaynak siteye tek bir sayfa istegi atiyor.
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # İş düzeyinde tanımlı: adım düzeyindeki `if` yalnızca burayı görebiliyor,
    # aynı adımda tanımlanan env'i göremiyor.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Metin çıkarma araçları (spec 7.2). tesseract-ocr-tur Türkçe dil paketi.
      #
      # python3-pdfminer BİRİNCİL çıkarıcıdır (scripts/extract-text/pdf_text.py).
      # Gömülü fontun ToUnicode tablosu kullanılamadığında pdftotext metni 29
      # kaydırılmış basıyor ve kaydırılmış karakter sıradan noktalamadan ayırt
      # EDİLEMİYOR; pdfminer aynı karakteri "(cid:N)" diye işaretliyor, cid.ts
      # geri çeviriyor. Python zaten ocrmypdf için kurulu.
      #
      # poppler-utils KALIYOR: pdfminer yoksa yedek yol, ve OCR çıktısı ondan okunuyor.
      - name: PDF ve OCR araçları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-tur ocrmypdf ghostscript \
            python3-pdfminer

      - run: npm ci
      - run: npm run ingest:daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      # LLM ÖZET KATMANI ARTIK BURADA DEĞİL -> summarize.yml
      #
      # İki sebep. (1) Özetleme 60 dakikalık iş zaman aşımını dolduruyordu ve
      # GitHub tüm koşumu `cancelled` işaretliyordu — 2 ve 3 Eylül'de ingest
      # dakikalar önce BAŞARIYLA bitmişken. Aslında sağlam olan kırmızı bir
      # koşum, sağlam olmayan kırmızı koşumu gizler. (2) Ingest artık 3 saatte
      # bir koşuyor; özetleme de onunla koşsaydı günde 8 kez çalışıp §6.2'deki
      # günlük istek kotasını yakardı.
