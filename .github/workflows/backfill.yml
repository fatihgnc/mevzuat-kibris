name: backfill

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Virgülle ayrılmış yıllar, örn. 2024,2023,2022'
        required: true

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        run: |
          YEARS='${{ inputs.years }}'
          JSON=$(printf '%s' "$YEARS" | tr ',' '\n' | tr -d ' ' | grep -E '^[0-9]{4}$' \
            | jq -R . | jq -sc .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  backfill:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Her job bir yıl. fail-fast kapalı: bir yılın OCR'ı patlarsa diğerleri devam etsin.
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # python3-pdfminer birincil çıkarıcı; gerekçesi daily-ingest.yml'de.
      - name: PDF ve OCR araçları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-tur ocrmypdf ghostscript \
            python3-pdfminer

      - run: npm ci
      - run: npm run ingest:daily ${{ matrix.year }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
