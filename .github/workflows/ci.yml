name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Ayrıştırma testleri ZORUNLU (spec 7.3): her parse değişikliğinde çalışır.
      # Ölçülen: kayıt sayısı, ref_number ve doc_type doğruluğu.
      - run: npm test
