name: dispatch-alerts

on:
  # workflow_run TETİKLEYİCİSİ KALDIRILDI — daily-ingest'in her bitişinde
  # koşuyordu ve tasarımla çelişiyordu.
  #
  # Gönderim penceresi `records.created_at > alerts.last_sent_at` (index.ts
  # findMatches). Yani her tetikleme, o andan beri gelen kayıtları yolluyor ve
  # `last_sent_at`'i ileri alıyor. Ingest günde 2 kez koşarken bu, aşağıdaki
  # günlük cron'a EK olarak 2 gönderim daha demekti: `daily` abone günde 3'e
  # kadar e-posta alıyordu. Ingest 3 saatte bire çıkınca 9 olacaktı.
  #
  # Oysa tasarım bunu istemiyor: aşağıdaki yorum gönderim saatini burasının
  # BELİRLEDİĞİNİ söylüyor, ve index.ts başlığı "There is no instant frequency"
  # diyor. Günlük alarm günde bir kez gönderilir.
  #
  # Yeni kayıtlar yine gecikmeden SİTEYE düşüyor — ingest onları 3 saatte bir
  # yakalıyor ve kendi revalidation'ını yapıyor. Değişen tek şey e-posta ritmi.
  schedule:
    # 08:00 TRT. Gönderim saatini BELİRLEYEN yer burasıdır ve herkes için aynıdır;
    # kullanıcı başına saat tercihi yok (profiles.digest_hour migration 0010'da
    # kaldırıldı, gerekçe HANDOFF §3.3). Saati değiştirmek isteyen burayı değiştirsin.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run alerts:dispatch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          ALERT_UNSUBSCRIBE_SECRET: ${{ secrets.ALERT_UNSUBSCRIBE_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
